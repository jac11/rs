name: Build Windows EXE

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install websocket-client pyinstaller pyautogui Pillow opencv-python numpy

      - name: Build EXE
        run: |
          pyinstaller --onefile --noconsole --name rs rs.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rs-windows
          path: dist/rs.exe
